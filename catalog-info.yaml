---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: devsecops-app
  title: Sample Microservice
  description: Flask microservice demonstrating golden-path deployment
  tags:
    - python
    - flask
    - microservice
  annotations:
    github.com/project-slug: Ankitkumar028/DevsecOps_full_stack_8AUg
    backstage.io/kubernetes-id: devsecops-app
    prometheus.io/rule: devsecops-app-rules
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: devsecops-platform
  providesApis:
    - devsecops-app-api
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: devsecops-app-api
  title: Sample Microservice API
  description: REST API for the sample microservice
spec:
  type: openapi
  lifecycle: production
  owner: platform-team
  system: devsecops-platform
  definition: |
    openapi: 3.0.0
    info:
      title: DevSecOps Sample API
      version: 0.1.0
    paths:
      /health/live:
        get:
          summary: Liveness probe
          responses:
            '200':
              description: Alive
      /health/ready:
        get:
          summary: Readiness probe
          responses:
            '200':
              description: Ready
      /api/v1/items:
        get:
          summary: List items
          responses:
            '200':
              description: List of items
      /metrics:
        get:
          summary: Prometheus metrics
          responses:
            '200':
              description: Prometheus text format
