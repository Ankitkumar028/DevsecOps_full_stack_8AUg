[k3s_nodes]
# Replace with your EC2 public IP after `terraform apply`
# You can also use the output: `terraform output instance_public_ip`
REPLACE_WITH_EC2_IP ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/YOUR_KEY.pem

[k3s_nodes:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
