---
# roles/argocd/tasks/main.yml

- name: Create argocd namespace
  ansible.builtin.command:
    cmd: kubectl create namespace argocd
  environment:
    KUBECONFIG: /home/ec2-user/.kube/config
  register: ns_result
  failed_when: ns_result.rc != 0 and 'already exists' not in ns_result.stderr
  changed_when: ns_result.rc == 0

- name: Clear stuck pending Helm release if previous run was interrupted
  ansible.builtin.shell: |
    STATUS=$(helm status argocd -n argocd -o json 2>/dev/null | jq -r '.info.status' || echo "none")
    if [ "$STATUS" = "pending-install" ] || [ "$STATUS" = "pending-upgrade" ]; then
      helm uninstall argocd -n argocd || true
    fi
  environment:
    KUBECONFIG: /home/ec2-user/.kube/config
  changed_when: false

- name: Install ArgoCD via Helm
  ansible.builtin.command: >
    helm upgrade --install argocd argo/argo-cd
    --namespace argocd
    --version {{ argocd_version }}
    --set server.insecure=true
    --set configs.params."server\.insecure"=true
    --set controller.resources.requests.memory=128Mi
    --set controller.resources.limits.memory=512Mi
    --set server.resources.requests.memory=64Mi
    --set server.resources.limits.memory=256Mi
    --set repoServer.resources.requests.memory=64Mi
    --set repoServer.resources.limits.memory=256Mi
    --set applicationSet.resources.requests.memory=32Mi
    --set applicationSet.resources.limits.memory=128Mi
    --set dex.enabled=false
    --set notifications.enabled=false
  register: helm_res
  until: helm_res.rc == 0
  retries: 3
  delay: 10
  environment:
    KUBECONFIG: /home/ec2-user/.kube/config
  changed_when: true

- name: Wait for ArgoCD server to be ready
  ansible.builtin.command: >
    kubectl rollout status deployment/argocd-server
    -n argocd --timeout=5m
  environment:
    KUBECONFIG: /home/ec2-user/.kube/config
  changed_when: false

- name: Get ArgoCD initial admin password
  ansible.builtin.command: >
    kubectl -n argocd get secret argocd-initial-admin-secret
    -o jsonpath="{.data.password}"
  environment:
    KUBECONFIG: /home/ec2-user/.kube/config
  register: argocd_pwd
  changed_when: false
  no_log: true

- name: Print ArgoCD password (save this!)
  ansible.builtin.debug:
    msg: "ArgoCD admin password: {{ argocd_pwd.stdout | b64decode }}"
