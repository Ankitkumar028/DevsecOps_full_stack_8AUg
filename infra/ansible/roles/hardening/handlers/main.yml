---
# roles/hardening/handlers/main.yml
- name: Restart SSH
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  failed_when: false

- name: Restart auditd
  ansible.builtin.command: /sbin/service auditd restart
  failed_when: false
