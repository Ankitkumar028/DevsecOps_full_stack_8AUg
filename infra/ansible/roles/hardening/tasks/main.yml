---
# roles/hardening/tasks/main.yml
# SSH hardening + fail2ban + auditd + unattended-upgrades

- name: Install hardening tools
  ansible.builtin.yum:
    name:
      - fail2ban
      - audit
      - aide
    state: present

# ─── SSH Hardening ────────────────────────────────────────────────────────────
- name: Configure SSH (harden defaults)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?{{ item.key }}"
    line: "{{ item.key }} {{ item.value }}"
    state: present
    validate: /usr/sbin/sshd -t -f %s
  loop:
    - { key: "PermitRootLogin",           value: "no" }
    - { key: "PasswordAuthentication",    value: "no" }
    - { key: "ChallengeResponseAuthentication", value: "no" }
    - { key: "X11Forwarding",             value: "no" }
    - { key: "MaxAuthTries",              value: "3" }
    - { key: "LoginGraceTime",            value: "30" }
    - { key: "AllowAgentForwarding",      value: "no" }
    - { key: "AllowTcpForwarding",        value: "no" }
    - { key: "ClientAliveInterval",       value: "300" }
    - { key: "ClientAliveCountMax",       value: "2" }
    - { key: "Protocol",                  value: "2" }
  notify: Restart SSH

# ─── Fail2Ban ────────────────────────────────────────────────────────────────
- name: Configure fail2ban for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime  = 3600
      findtime = 600
      maxretry = 5
      backend  = systemd

      [sshd]
      enabled  = true
      port     = ssh
      logpath  = %(sshd_log)s
      maxretry = 3
    mode: '0644'
  notify: Restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started

# ─── auditd ──────────────────────────────────────────────────────────────────
- name: Configure auditd rules (CIS Level 1 baseline)
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/devsecops.rules
    content: |
      # Monitor /etc/passwd changes
      -w /etc/passwd -p wa -k identity
      # Monitor /etc/sudoers changes
      -w /etc/sudoers -p wa -k sudoers
      # Monitor SSH config changes
      -w /etc/ssh/sshd_config -p wa -k sshd_config
      # Monitor cron
      -w /etc/cron.d -p wa -k cron
      # Monitor Kubernetes config
      -w /etc/rancher -p wa -k k3s
    mode: '0640'
  notify: Restart auditd

- name: Enable auditd
  ansible.builtin.systemd:
    name: auditd
    enabled: true
    state: started

# ─── Disable unused services ──────────────────────────────────────────────────
- name: Disable unnecessary services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - postfix
    - avahi-daemon
  failed_when: false   # not all services exist on all AMIs

handlers:
  - name: Restart SSH
    ansible.builtin.systemd:
      name: sshd
      state: restarted

  - name: Restart fail2ban
    ansible.builtin.systemd:
      name: fail2ban
      state: restarted

  - name: Restart auditd
    ansible.builtin.service:
      name: auditd
      state: restarted
