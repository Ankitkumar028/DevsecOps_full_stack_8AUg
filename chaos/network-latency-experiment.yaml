---
# chaos/network-latency-experiment.yaml
# Chaos Mesh — injects 200ms ± 50ms network latency into app pod
# Tests: SLO p99 latency alert + client timeout behavior

apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: app-network-latency
  namespace: devsecops
  annotations:
    experiment.description: "Inject 200ms latency — tests HighP99Latency alert threshold (>500ms needs 300ms)"
spec:
  action: delay
  mode: one
  selector:
    namespaces:
      - devsecops
    labelSelectors:
      app.kubernetes.io/name: app
  delay:
    latency: "200ms"
    correlation: "50"
    jitter: "50ms"
  direction: to
  duration: "5m"
