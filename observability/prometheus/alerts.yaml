---
# Prometheus alerting rules for the DevSecOps platform
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: devsecops-app-rules
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    # ── SLO: 99% HTTP Success Rate (error budget) ─────────────────────────────
    - name: slo.http_success_rate
      interval: 1m
      rules:
        - record: job:http_requests_total:rate5m
          expr: |
            sum(rate(http_requests_total[5m])) by (job)

        - record: job:http_requests_errors:rate5m
          expr: |
            sum(rate(http_requests_total{status=~"5.."}[5m])) by (job)

        - alert: HighErrorRate
          expr: |
            (
              job:http_requests_errors:rate5m
              /
              job:http_requests_total:rate5m
            ) > 0.01
          for: 5m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "High error rate on {{ $labels.job }}"
            description: "Error rate is {{ $value | humanizePercentage }} — SLO breach (> 1%)"
            runbook_url: "https://github.com/REPLACE_ORG/DevsecOps_full_stack_8AUg/blob/main/docs/runbooks/high-error-rate.md"

    # ── Latency SLO: p99 < 500ms ─────────────────────────────────────────────
    - name: slo.latency
      rules:
        - alert: HighP99Latency
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket[5m])) by (le, endpoint)
            ) > 0.5
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "p99 latency high on {{ $labels.endpoint }}"
            description: "p99 latency is {{ $value | humanizeDuration }} (SLO: < 500ms)"

    # ── Infrastructure ────────────────────────────────────────────────────────
    - name: infra.node
      rules:
        - alert: NodeHighCPU
          expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Node CPU above 80% for 10 minutes"
            description: "Instance {{ $labels.instance }}: {{ $value }}% CPU"

        - alert: NodeHighMemory
          expr: |
            (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node memory above 85%"
            description: "Available: {{ $value }}% used — free-tier node may OOM"

        - alert: NodeDiskRunningFull
          expr: |
            (node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"})
            / node_filesystem_size_bytes{mountpoint="/"} > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Root disk > 80% full"

    # ── Pod health ────────────────────────────────────────────────────────────
    - name: workloads.pods
      rules:
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "{{ $value }} restarts in last 15 minutes"

        - alert: PodNotReady
          expr: kube_pod_status_ready{condition="false"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} not ready"
