---
# Kyverno policy: block latest image tag in production namespace
# Forces teams to use pinned, immutable image tags
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow Latest Tag
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      The ':latest' tag is mutable and makes rollbacks unreliable.
      All images must use a specific, pinned tag (e.g. sha-abc1234).
spec:
  validationFailureAction: Enforce
  background: true

  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [devsecops]
      validate:
        message: "Images must specify a non-latest tag (e.g. sha-abc1234 or v1.2.3)"
        pattern:
          spec:
            containers:
              - image: "?*:?*"
            =(initContainers):
              - image: "?*:?*"

    - name: disallow-latest-tag
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [devsecops]
      validate:
        message: "The ':latest' tag is not allowed. Use a pinned image digest or semver tag."
        foreach:
          - list: "request.object.spec.containers"
            deny:
              conditions:
                any:
                  - key: "{{ element.image }}"
                    operator: Equals
                    value: "*:latest"
