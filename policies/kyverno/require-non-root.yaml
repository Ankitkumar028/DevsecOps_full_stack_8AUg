---
# policy: require-non-root.yaml
# Kyverno ClusterPolicy — blocks any pod running as root
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-non-root-user
  annotations:
    policies.kyverno.io/title: Require Non-Root User
    policies.kyverno.io/category: Pod Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      All containers must run as a non-root user (UID >= 1000).
spec:
  validationFailureAction: Enforce
  background: true

  rules:
    - name: check-runAsNonRoot
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [devsecops]
      validate:
        message: "Containers must set runAsNonRoot: true and runAsUser >= 1000"
        pattern:
          spec:
            securityContext:
              runAsNonRoot: true
            containers:
              - securityContext:
                  runAsUser: ">=1000"
