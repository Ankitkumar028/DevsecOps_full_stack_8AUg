name: Terraform CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'infra/terraform/**'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: apply
        type: choice
        options: [plan, apply, destroy]

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    name: Terraform ${{ github.event.inputs.action || (github.event_name == 'pull_request' && 'plan') || 'apply' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    env:
      AWS_ACCESS_KEY_ID:       ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY:   ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_key_name:         ${{ secrets.TF_VAR_KEY_NAME }}
      TF_VAR_allowed_ssh_cidr: ${{ secrets.TF_VAR_ALLOWED_SSH_CIDR }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.8.5'
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: infra/terraform

      # ── Bootstrap: Create S3 + DynamoDB backend if not exists ──
      - name: Bootstrap — Init
        working-directory: infra/terraform/bootstrap
        run: terraform init -input=false

      - name: Bootstrap — Apply (create S3 bucket + DynamoDB lock table)
        working-directory: infra/terraform/bootstrap
        run: terraform apply -auto-approve -input=false

      - name: Bootstrap — Print state bucket name
        working-directory: infra/terraform/bootstrap
        run: |
          BUCKET=$(terraform output -raw state_bucket_name)
          echo "✅ State bucket: $BUCKET"

      # ── Main Infrastructure ──
      - name: Terraform Init
        working-directory: infra/terraform
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: infra/terraform
        run: terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: infra/terraform
        run: terraform plan -out=tfplan -no-color
        continue-on-error: true

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan 📋
            \`\`\`
            ${{ steps.plan.outputs.stdout }}
            \`\`\`
            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Terraform Apply
        if: |
          (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
          (github.event.inputs.action == 'apply')
        working-directory: infra/terraform
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: infra/terraform
        run: terraform destroy -auto-approve

      - name: Print EC2 Public IP
        if: github.event.inputs.action != 'destroy'
        working-directory: infra/terraform
        run: |
          IP=$(terraform output -raw instance_public_ip 2>/dev/null || echo "N/A")
          echo "🖥️ EC2 Public IP: $IP"
          echo "👉 Go to GitHub Actions → Ansible Bootstrap → Run workflow → Enter IP: $IP"
