name: Reusable — Build & Push Container

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      context:
        required: false
        type: string
        default: "."
      dockerfile:
        required: false
        type: string
        default: "Dockerfile"
      push:
        required: false
        type: boolean
        default: true
    outputs:
      image_tag:
        description: "Full image tag pushed to registry"
        value: ${{ jobs.build.outputs.image_tag }}
      image_digest:
        description: "Image digest for provenance"
        value: ${{ jobs.build.outputs.image_digest }}
    secrets:
      inherit   # automatically passes all secrets including GITHUB_TOKEN

jobs:
  build:
    name: Build & Push — ${{ inputs.image_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag:    ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ inputs.image_name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context:    ${{ inputs.context }}
          file:       ${{ inputs.context }}/${{ inputs.dockerfile }}
          push:       ${{ inputs.push }}
          tags:       ${{ steps.meta.outputs.tags }}
          labels:     ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
