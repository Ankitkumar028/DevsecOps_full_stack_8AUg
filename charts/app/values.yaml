# Default values for the app Helm chart.
# Override per environment with -f values-prod.yaml etc.

replicaCount: 1

image:
  repository: ghcr.io/Ankitkumar028/devsecops-full-stack_8aug/app  # updated by CI
  pullPolicy: IfNotPresent
  tag: sha-fa1fee1

imagePullSecrets:
  - name: ghcr-secret

nameOverride: ""
fullnameOverride: "devsecops-app"

serviceAccount:
  create: true
  automount: false
  name: "devsecops-app"

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port:   "5000"
  prometheus.io/path:   "/metrics"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: "traefik"    # k3s default ingress
  annotations: {}
  hosts:
    - host: app.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu:    "500m"
    memory: "256Mi"
  requests:
    cpu:    "100m"
    memory: "128Mi"

livenessProbe:
  httpGet:
    path: /health/live
    port: 5000
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health/ready
    port: 5000
  initialDelaySeconds: 5
  periodSeconds: 10

autoscaling:
  enabled: false

env:
  APP_ENV: "production"
  APP_VERSION: "0.1.0"

# Volumes needed for read-only filesystem
volumes:
  - name: tmp
    emptyDir: {}

volumeMounts:
  - name: tmp
    mountPath: /tmp

nodeSelector: {}
tolerations: []
affinity: {}
